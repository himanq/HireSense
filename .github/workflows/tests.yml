name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check analyzer.js && node --check script.js
      - name: Run unit and static regression tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright axe-core
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop/mobile workflows and downloads
        run: node tests/browser-smoke.cjs
      - name: Run automated accessibility audit
        run: node tests/accessibility-smoke.cjs
