name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check analyzer.js && node --check script.js
      - name: Run test suite
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop/mobile analysis and downloads in Chromium
        run: node tests/browser-smoke.cjs
